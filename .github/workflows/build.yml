name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create android project
        run: flutter create --platforms=android --project-name aac_tap_talk .
      - name: Patch android config
        run: |
          python3 - <<'PY'
          import re,glob
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          add='''<uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <queries><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries>
              <application'''
          s=s.replace('<application',add,1)
          open(p,'w').write(s)
          for g in glob.glob('android/app/build.gradle*'):
              t=open(g).read()
              t=t.replace('minSdk = flutter.minSdkVersion','minSdk = 24').replace('minSdkVersion flutter.minSdkVersion','minSdkVersion 24')
              open(g,'w').write(t)
          PY
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: tap-and-talk-apk
          path: build/app/outputs/flutter-apk/app-release.apk
